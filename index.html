<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Naughty Serpent</title>
    <style>
        body { margin:0; background:#1a0000; color:white; font-family:Arial; text-align:center; overflow:hidden; }
        canvas { background:#330011; display:block; margin:10px auto; touch-action:none; border:3px solid #ff3366; box-shadow:0 0 20px #ff0000; }
        h1 { color:#ff3366; margin:10px; text-shadow:0 0 15px #ff0000; }
        #score { font-size:26px; color:#ffcc00; margin:5px; }
    </style>
</head>
<body>
    <h1>🥃 Naughty Serpent 🥃</h1>
    <div id="score">Pleasure Points: 0</div>
    <canvas id="game" width="420" height="420"></canvas>
    <div style="font-size:14px; color:#aaa; margin-top:8px;">
        Swipe to slither • Drink the shots • Feel the pleasure
    </div>

<script>
// Adult Naughty Serpent - Shots & Provocative Snake
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("score");

const grid = 21;
let count = 0;
let score = 0;

let snake = { x: 180, y: 180, dx: grid, dy: 0, cells: [], maxCells: 4 };
let shot = { x: 300, y: 300 };
let gameOverFlag = false;

let touchStartX = 0, touchStartY = 0;

function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

function resetGame() {
    snake.x = 180; snake.y = 180; snake.cells = []; snake.maxCells = 4;
    snake.dx = grid; snake.dy = 0;
    score = 0; scoreElement.textContent = "Pleasure Points: 0";
    gameOverFlag = false;
    shot.x = getRandomInt(0, 19) * grid;
    shot.y = getRandomInt(0, 19) * grid;
}

function loop() {
    if (gameOverFlag) return;
    requestAnimationFrame(loop);
    count++;
    if (count < 5) return;   // speed
    count = 0;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    snake.x += snake.dx;
    snake.y += snake.dy;

    if (snake.x >= canvas.width) snake.x = 0;
    if (snake.x < 0) snake.x = canvas.width;
    if (snake.y >= canvas.height) snake.y = 0;
    if (snake.y < 0) snake.y = canvas.height;

    snake.cells.unshift({ x: snake.x, y: snake.y });
    if (snake.cells.length > snake.maxCells) snake.cells.pop();

    // Provocative glossy snake
    for (let i = 0; i < snake.cells.length; i++) {
        const cell = snake.cells[i];
        const grad = ctx.createLinearGradient(cell.x, cell.y, cell.x + grid, cell.y + grid/2);
        grad.addColorStop(0, i === 0 ? "#ff69b4" : "#c71585");
        grad.addColorStop(1, "#8b008b");
        ctx.fillStyle = grad;
        ctx.fillRect(cell.x, cell.y, grid-1, grid-1);

        if (i === 0) { // suggestive head
            ctx.fillStyle = "#ff1493";
            ctx.fillRect(cell.x + 5, cell.y + 5, 11, 11);
        }
    }

    // Glowing shot
    ctx.fillStyle = "#ff4500";
    ctx.fillRect(shot.x + 4, shot.y + 4, grid-8, grid-10);
    ctx.fillStyle = "#ffd700";
    ctx.fillRect(shot.x + 8, shot.y + 7, grid-16, 7); // liquid shine

    // Eat shot
    if (snake.x === shot.x && snake.y === shot.y) {
        snake.maxCells++;
        score += 15;
        scoreElement.textContent = `Pleasure Points: ${score}`;
        shot.x = getRandomInt(0, 19) * grid;
        shot.y = getRandomInt(0, 19) * grid;
    }

    // Self collision
    for (let i = 1; i < snake.cells.length; i++) {
        if (snake.x === snake.cells[i].x && snake.y === snake.cells[i].y) {
            gameOverFlag = true;
            ctx.fillStyle = "rgba(0,0,0,0.9)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#ff3366";
            ctx.font = "bold 32px Arial";
            ctx.fillText("Game Over 😈", 70, 180);
            ctx.font = "20px Arial";
            ctx.fillText(`You scored ${score} pleasure`, 75, 230);
            ctx.fillText("Tap to play again", 100, 270);
        }
    }
}

// Keyboard
document.addEventListener("keydown", e => {
    if (gameOverFlag) { resetGame(); return; }
    if (e.key === "ArrowLeft" && snake.dx !== grid) { snake.dx = -grid; snake.dy = 0; }
    else if (e.key === "ArrowUp" && snake.dy !== grid) { snake.dx = 0; snake.dy = -grid; }
    else if (e.key === "ArrowRight" && snake.dx !== -grid) { snake.dx = grid; snake.dy = 0; }
    else if (e.key === "ArrowDown" && snake.dy !== -grid) { snake.dx = 0; snake.dy = grid; }
});

// Touch swipe
canvas.addEventListener("touchstart", e => {
    if (gameOverFlag) { resetGame(); return; }
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
});

canvas.addEventListener("touchend", e => {
    if (gameOverFlag) return;
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchStartX - touchEndX;
    const diffY = touchStartY - touchEndY;

    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
        else if (diffX < -30 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
    } else {
        if (diffY > 30 && snake.dy === 0) { snake.dx = 0; snake.dy = -grid; }
        else if (diffY < -30 && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
    }
});

canvas.addEventListener("click", () => { if (gameOverFlag) resetGame(); });

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
