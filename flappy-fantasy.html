<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Fantasy</title>
    <style>
        body { margin:0; background:#5c94fc; text-align:center; color:white; font-family:Arial; overflow:hidden; }
        canvas { display:block; margin:10px auto; background:#71c5ee; border:5px solid white; }
    </style>
</head>
<body>
    <h1>Flappy Fantasy 🐉</h1>
    <canvas id="game" width="400" height="600"></canvas>
    <p style="font-size:18px;">Tap to flap • Avoid the green pipes</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let birdY = 250;
let velocity = 0;
const gravity = 0.5;
const flapPower = -9;   // <-- Easier flap (was -12.5)

let pipes = [];
let score = 0;
let gameRunning = true;
let frame = 0;

function reset() {
    birdY = 250;
    velocity = 0;
    pipes = [{x: 350, top: 200}];
    score = 0;
    frame = 0;
}

function draw() {
    ctx.clearRect(0, 0, 400, 600);

    // Pipes
    ctx.fillStyle = "#00aa00";
    for (let p of pipes) {
        ctx.fillRect(p.x, 0, 80, p.top);
        ctx.fillRect(p.x, p.top + 200, 80, 600);
    }

    // Bird
    ctx.fillStyle = "#00cc44";
    ctx.fillRect(80, birdY, 45, 35);

    // Score
    ctx.fillStyle = "white";
    ctx.font = "bold 48px Arial";
    ctx.fillText(score, 160, 80);
}

function update() {
    if (!gameRunning) return;
    frame++;
    velocity += gravity;
    birdY += velocity;

    if (frame % 90 === 0) {
        const top = 120 + Math.random() * 200;
        pipes.push({x: 420, top: top});
    }

    for (let i = 0; i < pipes.length; i++) {
        pipes[i].x -= 2.2;

        if (pipes[i].x + 80 < 80 && !pipes[i].passed) {
            pipes[i].passed = true;
            score++;
        }

        if (80 + 45 > pipes[i].x && 80 < pipes[i].x + 80) {
            if (birdY < pipes[i].top || birdY + 35 > pipes[i].top + 200) {
                gameRunning = false;
                alert("Game Over! Score: " + score + "\n\nTap OK to try again");
                reset();
                gameRunning = true;
            }
        }
    }

    if (pipes[0] && pipes[0].x < -100) pipes.shift();

    if (birdY > 550 || birdY < 0) {
        gameRunning = false;
        alert("Game Over! Score: " + score + "\n\nTap OK to try again");
        reset();
        gameRunning = true;
    }
}

function flap() {
    if (gameRunning) velocity = flapPower;
}

canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", e => { e.preventDefault(); flap(); });

reset();
setInterval(() => {
    update();
    draw();
}, 20);
</script>
</body>
</html>
