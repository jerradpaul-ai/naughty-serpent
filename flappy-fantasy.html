<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Test</title>
    <style>
        body { margin:0; background:#5c94fc; text-align:center; color:white; }
        canvas { display:block; margin:20px auto; background:#71c5ee; border:4px solid white; }
    </style>
</head>
<body>
    <h1>Flappy Test 🐉</h1>
    <canvas id="game" width="400" height="600"></canvas>
    <p>Tap the screen to flap</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let y = 300;
let vel = 0;

function draw() {
    ctx.clearRect(0, 0, 400, 600);
    ctx.fillStyle = "#00cc44";
    ctx.fillRect(80, y, 40, 30);
}

function loop() {
    vel += 0.6;
    y += vel;
    if (y > 550) y = 300, vel = 0;
    draw();
    requestAnimationFrame(loop);
}

canvas.addEventListener("click", () => vel = -13);
canvas.addEventListener("touchstart", e => { e.preventDefault(); vel = -13; });

loop();
</script>
</body>
</html>
