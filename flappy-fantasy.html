<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Fantasy</title>
    <style>
        body { margin:0; background:#5c94fc; font-family:Arial; text-align:center; overflow:hidden; color:white; }
        canvas { display:block; margin:20px auto; background:#71c5ee; border:6px solid #fff; box-shadow:0 0 30px rgba(0,0,0,0.4); }
        #screens { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        button { pointer-events:auto; padding:15px 40px; font-size:22px; background:#ffcc00; color:#000; border:none; border-radius:12px; margin:10px; }
    </style>
</head>
<body>
    <h1 style="margin:15px; text-shadow:3px 3px 6px #000;">Flappy Fantasy 🐉🍄🌈</h1>
    <canvas id="game" width="400" height="600"></canvas>

    <div id="startScreen" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h2>Choose Your Hero!</h2>
        <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
            <button onclick="selectChar(0)">🐉 Yoshi Dragon</button>
            <button onclick="selectChar(1)">🍄 Cloud Toad</button>
            <button onclick="selectChar(2)">🌈 Rainbow Birb</button>
            <button onclick="selectChar(3)">🔥 Fire Sprite</button>
        </div>
    </div>

    <div id="gameOverScreen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); flex-direction:column; justify-content:center; align-items:center;">
        <h2 id="deathMsg"></h2>
        <p id="scoreText" style="font-size:28px; margin:10px;"></p>
        <button onclick="restart()">Tap to Fly Again!</button>
    </div>

<script>
// Game code (same bright Flappy Fantasy as before)
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let birdX = 80, birdY = 250, birdVel = 0, gravity = 0.55, flap = -11.5;
let pipes = [], score = 0, highScore = 0, gameRunning = false, char = 0;
let frame = 0;

const chars = [
    {c:"#00cc44", name:"Yoshi Dragon"},
    {c:"#ffdd00", name:"Cloud Toad"},
    {c:"#ff44ff", name:"Rainbow Birb"},
    {c:"#ff5500", name:"Fire Sprite"}
];

function selectChar(n) {
    char = n;
    document.getElementById("startScreen").style.display = "none";
    reset();
    gameRunning = true;
}

function reset() {
    birdY = 250; birdVel = 0; pipes = []; score = 0; frame = 0;
    pipes.push({x:380, top:180 + Math.random()*140, passed:false});
}

function drawBird() {
    const col = chars[char].c;
    ctx.fillStyle = col;
    ctx.fillRect(birdX, birdY, 36, 26);
    ctx.fillStyle = "#fff";
    ctx.fillRect(birdX+24, birdY+7, 14, 11);
    ctx.fillStyle = "#000";
    ctx.fillRect(birdX+28, birdY+10, 7, 7);
}

function drawPipe(x, top) {
    ctx.fillStyle = "#0b8e3d";
    ctx.fillRect(x, 0, 62, top);
    ctx.fillRect(x, top+170, 62, 600);
    ctx.fillStyle = "#0a7a33";
    ctx.fillRect(x-5, top-25, 72, 35);
    ctx.fillRect(x-5, top+145, 72, 35);
}

function update() {
    if (!gameRunning) return;
    frame++;
    birdVel += gravity;
    birdY += birdVel;

    if (frame % 85 === 0) {
        const top = 120 + Math.random() * 220;
        pipes.push({x:420, top:top, passed:false});
    }

    for (let i=0; i<pipes.length; i++) {
        pipes[i].x -= 2.4;
        if (!pipes[i].passed && pipes[i].x < birdX) {
            pipes[i].passed = true;
            score++;
        }
        if (birdX+30 > pipes[i].x && birdX < pipes[i].x+62) {
            if (birdY < pipes[i].top || birdY+24 > pipes[i].top+170) endGame();
        }
    }
    if (pipes[0] && pipes[0].x < -80) pipes.shift();

    if (birdY > 560 || birdY < -20) endGame();
}

function draw() {
    ctx.clearRect(0,0,400,600);
    for (let p of pipes) drawPipe(p.x, p.top);
    drawBird();
    ctx.fillStyle = "white";
    ctx.font = "bold 52px Arial";
    ctx.fillText(score, 175, 90);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameRunning = false;
    if (score > highScore) highScore = score;
    const msgs = ["Oof! Even Bowser is laughing 😂", "You're still a legend! Try again 💪", "The pipes got you this time!", "Flap harder next round hero!", "Nice effort! Keep flying!"];
    document.getElementById("deathMsg").textContent = msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById("scoreText").innerHTML = Score: ${score}<br>Best: ${highScore};
    document.getElementById("gameOverScreen").style.display = "flex";
}

function restart() {
    document.getElementById("gameOverScreen").style.display = "none";
    reset();
    gameRunning = true;
}

canvas.addEventListener("click", () => { if (gameRunning) birdVel = flap; });
canvas.addEventListener("touchstart", e => { e.preventDefault(); if (gameRunning) birdVel = flap; });

gameLoop();
</script>
</body>
</html>
