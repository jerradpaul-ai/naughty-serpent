<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Fantasy</title>
    <style>
        body { margin:0; background:#5c94fc; font-family:Arial; text-align:center; color:white; overflow:hidden; }
        canvas { display:block; margin:10px auto; background:#71c5ee; border:6px solid white; }
        h1 { margin:10px; text-shadow:3px 3px 6px #000; }
    </style>
</head>
<body>
    <h1>Flappy Fantasy 🐉</h1>
    <canvas id="game" width="400" height="600"></canvas>
    <div style="margin-top:10px; font-size:18px;">Tap screen to flap</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let birdY = 250, birdVel = 0, gravity = 0.6, flap = -12;
let pipes = [], score = 0, gameRunning = true, frame = 0;

function reset() {
    birdY = 250; birdVel = 0; pipes = []; score = 0; frame = 0;
    pipes.push({x:350, top:180});
}

function draw() {
    ctx.clearRect(0,0,400,600);

    // pipes
    ctx.fillStyle = "#0b8e3d";
    for (let p of pipes) {
        ctx.fillRect(p.x, 0, 60, p.top);
        ctx.fillRect(p.x, p.top + 170, 60, 600);
    }

    // bird
    ctx.fillStyle = "#00cc44";
    ctx.fillRect(80, birdY, 36, 26);
    ctx.fillStyle = "white";
    ctx.fillRect(100, birdY+8, 14, 11);

    // score
    ctx.fillStyle = "white";
    ctx.font = "bold 50px Arial";
    ctx.fillText(score, 170, 80);
}

function update() {
    if (!gameRunning) return;
    frame++;
    birdVel += gravity;
    birdY += birdVel;

    if (frame % 80 === 0) pipes.push({x:420, top:100 + Math.random()*220});

    for (let i = 0; i < pipes.length; i++) {
        pipes[i].x -= 2.5;
        if (pipes[i].x + 60 < 80 && !pipes[i].passed) {
            pipes[i].passed = true;
            score++;
        }
        if (80 + 36 > pipes[i].x && 80 < pipes[i].x + 60) {
            if (birdY < pipes[i].top || birdY + 26 > pipes[i].top + 170) gameOver();
        }
    }
    if (pipes[0] && pipes[0].x < -70) pipes.shift();

    if (birdY > 550 || birdY < 0) gameOver();
}

function gameOver() {
    gameRunning = false;
    alert("Game Over! Score: " + score + "\nTap OK to restart");
    reset();
    gameRunning = true;
}

function flap() {
    if (gameRunning) birdVel = flap;
}

canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", e => { e.preventDefault(); flap(); });

reset();
setInterval(() => {
    update();
    draw();
}, 16);
</script>
</body>
</html>
